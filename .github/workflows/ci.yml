name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 输出工具链版本
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: 安装固定 Rust 工具链
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component rustfmt --component clippy

      - name: 检查 Swift 格式
        run: >-
          xcrun swift format lint --recursive --strict
          Sources Tests SharedCore/Adapters/Swift

      - name: 检查并运行共享核心探针
        run: |
          python3 scripts/validate_shared_core.py
          scripts/test_shared_core_macos.sh

      - name: 检查发布与统计脚本
        run: |
          bash -n \
            scripts/build-release-dmg.sh \
            scripts/generate-download-badge-json.sh \
            scripts/generate-sparkle-appcast.sh \
            scripts/generate-release-notes.sh \
            scripts/sign-sparkle-framework.sh \
            scripts/smoke-test-release-launch.sh \
            scripts/test_shared_core_macos.sh \
            scripts/test-generate-download-badge-json.sh \
            scripts/test-generate-release-notes.sh \
            scripts/verify-sparkle-release.sh
          scripts/test-generate-download-badge-json.sh
          scripts/test-generate-release-notes.sh
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_release_platform_descriptors.py

      - name: 构建并运行测试
        run: |
          xcodebuild \
            -project MihomoMeter.xcodeproj \
            -scheme MihomoMeter \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MihomoMeterDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build test
