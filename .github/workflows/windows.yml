name: Windows 构建与测试

on:
  workflow_dispatch:
    inputs:
      version:
        description: Windows 预览版本（X.Y.Z）
        required: false
        default: "0.0.0"
        type: string
  pull_request:
    paths:
      - "platform/windows/**"
      - "scripts/validate_windows.py"
      - "scripts/windows_validation_contract.py"
      - "scripts/windows_validation_quota_contract.py"
      - "scripts/windows_validation_connection_contract.py"
      - "scripts/windows_validation_distribution_contract.py"
      - "scripts/validate_windows.ps1"
      - "scripts/package_windows.ps1"
      - "scripts/build_windows_installer.ps1"
      - "platform/windows/installer/**"
      - "docs/Windows工程代码技术选型.md"
      - "docs/Windows阶段W0实机指南.md"
      - "docs/Windows阶段W1实机指南.md"
      - "docs/Windows阶段W2A实机指南.md"
      - "docs/Windows阶段W2B实机指南.md"
      - "docs/Windows阶段W2C实机指南.md"
      - "docs/Windows订阅配额实现契约.md"
      - "docs/Windows阶段W2D0实机指南.md"
      - "docs/Windows阶段W2D1实机指南.md"
      - "docs/Windows阶段W2D2实机指南.md"
      - "docs/Windows连接分析实现契约.md"
      - "docs/Windows阶段W3-0实机指南.md"
      - "docs/Windows阶段W3-1实机指南.md"
      - "docs/Windows分发实现契约.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "platform/windows/**"
      - "scripts/validate_windows.py"
      - "scripts/windows_validation_contract.py"
      - "scripts/windows_validation_quota_contract.py"
      - "scripts/windows_validation_connection_contract.py"
      - "scripts/windows_validation_distribution_contract.py"
      - "scripts/validate_windows.ps1"
      - "scripts/package_windows.ps1"
      - "scripts/build_windows_installer.ps1"
      - "platform/windows/installer/**"
      - "docs/Windows工程代码技术选型.md"
      - "docs/Windows阶段W0实机指南.md"
      - "docs/Windows阶段W1实机指南.md"
      - "docs/Windows阶段W2A实机指南.md"
      - "docs/Windows阶段W2B实机指南.md"
      - "docs/Windows阶段W2C实机指南.md"
      - "docs/Windows订阅配额实现契约.md"
      - "docs/Windows阶段W2D0实机指南.md"
      - "docs/Windows阶段W2D1实机指南.md"
      - "docs/Windows阶段W2D2实机指南.md"
      - "docs/Windows连接分析实现契约.md"
      - "docs/Windows阶段W3-0实机指南.md"
      - "docs/Windows阶段W3-1实机指南.md"
      - "docs/Windows分发实现契约.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试并打包 Windows x64 预览产物
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.codex-tmp/nuget
      WINDOWS_PREVIEW_VERSION: ${{ inputs.version || '0.0.0' }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装固定 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: platform/windows/global.json

      - name: 安装固定 NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nsis --version=3.12.0 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS 3.12.0 安装失败。"
          }
          $compiler = Get-Command makensis.exe -CommandType Application
          Write-Host "使用 NSIS 编译器：$($compiler.Source)"

      - name: 执行 Windows 静态、测试、构建与发布检查
        shell: pwsh
        run: pwsh -File scripts/validate_windows.ps1 -Version "$env:WINDOWS_PREVIEW_VERSION"

      - name: 上传 Windows W3-1 x64 预览包
        uses: actions/upload-artifact@v7
        with:
          name: mihomo-meter-windows-w3-preview-${{ env.WINDOWS_PREVIEW_VERSION }}-${{ github.sha }}
          path: .codex-tmp/windows-package
          if-no-files-found: error
          retention-days: 14
