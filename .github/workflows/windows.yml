name: Windows 构建与测试

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "platform/windows/**"
      - "scripts/validate_windows.py"
      - "scripts/windows_validation_contract.py"
      - "scripts/validate_windows.ps1"
      - "docs/Windows工程代码技术选型.md"
      - "docs/Windows阶段W0实机指南.md"
      - "docs/Windows阶段W1实机指南.md"
      - "docs/Windows阶段W2A实机指南.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "platform/windows/**"
      - "scripts/validate_windows.py"
      - "scripts/windows_validation_contract.py"
      - "scripts/validate_windows.ps1"
      - "docs/Windows工程代码技术选型.md"
      - "docs/Windows阶段W0实机指南.md"
      - "docs/Windows阶段W1实机指南.md"
      - "docs/Windows阶段W2A实机指南.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试并构建 Windows x64 预览产物
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.codex-tmp/nuget

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装固定 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: platform/windows/global.json

      - name: 执行 Windows 静态、测试、构建与发布检查
        shell: pwsh
        run: pwsh -File scripts/validate_windows.ps1

      - name: 上传 Windows W2A x64 预览目录
        uses: actions/upload-artifact@v7
        with:
          name: mihomo-meter-windows-w2a-x64-${{ github.sha }}
          path: .codex-tmp/windows-w2a-publish
          if-no-files-found: error
          retention-days: 14
