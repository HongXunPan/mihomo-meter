name: 功能建议
description: 提出符合项目边界的新能力
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请先描述用户问题，不要只描述预设实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明期望行为、使用场景和边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 可说明其他做法及其不足。
  - type: checkboxes
    id: scope
    attributes:
      label: 项目边界确认
      options:
        - label: 该建议不要求项目内置代理核心、抓包或修改系统代理配置。
          required: true
        - label: 该建议不依赖提交真实订阅、节点或流量明细。
          required: true
