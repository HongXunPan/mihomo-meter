name: 缺陷报告
description: 报告可复现的程序异常
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认内容不包含 Controller Secret、订阅地址、节点信息或完整连接目标。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明实际行为和预期行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定且已脱敏的复现步骤。
      placeholder: |
        1. 启动……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Mihomo Meter 版本
      placeholder: 例如 0.1.0 或 commit
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 26.5
    validations:
      required: true
  - type: input
    id: mihomo-version
    attributes:
      label: Mihomo 版本
      description: 如果问题与 Controller 无关，可填写“不适用”。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可提供已脱敏的日志、截图或响应结构。请勿提交任何凭证或真实连接目标。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现相同问题。
          required: true
        - label: 我确认提交内容不包含 Secret、订阅地址、节点或真实连接目标。
          required: true
